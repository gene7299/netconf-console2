name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked environment tool
        run: python -m pip install uv==0.12.9
      - name: Install locked headless package
        run: uv sync --locked --no-default-groups --group test
      - name: Headless unit tests
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider tests/unit/test_cli.py tests/unit/test_session.py tests/unit/test_operations.py tests/unit/test_capabilities.py tests/unit/test_namespaces.py tests/unit/test_history.py tests/unit/test_testapi.py tests/unit/test_testapi_peer_close.py
      - name: CLI smoke test
        run: uv run --no-sync netconf-console2 --help

  frozen-ubuntu-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked environment tool and build prerequisite
        run: |
          python -m pip install uv==0.12.9
          sudo apt-get update
          sudo apt-get install -y binutils libgnutls30 tcpdump
      - name: Build locked headless executable
        run: ./packaging/build-ubuntu-cli.sh
      - name: Three consecutive backend qualification rounds
        run: >-
          uv run --no-sync python tests/integration/qualify_headless_backend.py
          --exe exportToColleagueUbuntu/netconf-console2
          --output build/ci-backend-qualification --rounds 3
