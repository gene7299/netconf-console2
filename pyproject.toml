[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "netconf-console2"
version = "3.10.0"
description = "Headless NETCONF CLI and optional GUI for O-RAN O-RU management-plane testing"
requires-python = ">=3.10,<3.14"
dependencies = [
  "bcrypt>=4.2,<6",
  "cffi>=1.17,<3; platform_python_implementation == 'CPython'",
  "cryptography>=44,<51",
  "lxml>=5.3,<7",
  "ncclient==0.7.1",
  "paramiko>=3.5,<5.1",
  "prompt-toolkit>=3.0.48,<4",
  "pyang>=2.7,<3",
  "PyNaCl>=1.5,<2",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The default installation and Ubuntu CLI bundle are headless.  Neither
# PySide6 nor tkinter is pulled into the test runner.
gui = ["PySide6>=6.7,<7"]

[project.scripts]
netconf-console2 = "netconf_console.ncc:main"

[project.gui-scripts]
netconf-console2-gui = "netconf_console.gui.qt_app:main"
netconf-console2-gui-tk = "netconf_console.gui.app:main"

[dependency-groups]
build = ["pyinstaller==6.16.0"]
test = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "ncc"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["ncc"]

[tool.setuptools.package-data]
"netconf_console.gui" = ["assets/*.ico", "assets/*.json"]

[tool.uv]
package = true
default-groups = []
